<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Лабораторна робота №2: таблиці HTML-5 та зображення засобами CSS-3">
    <title>Брітіков О., ІО-41, ЛР2, варіант 66</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Лабораторна робота №2</h1>

    <h2>Завдання 1. Таблиця (варіант 66 → макет 6)</h2>
    <table class="variant-table">
        <tr>
            <td class="r1" rowspan="2">Брітіков</td>
            <td class="r1" colspan="2">Олександр</td>
            <td class="r1">Денисович</td>
            <td class="r1">&nbsp;</td>
        </tr>
        <tr>
            <td class="r2" rowspan="2">ІО-41</td>
            <td class="r2" rowspan="2">ЛР-2</td>
            <td class="r2" rowspan="3">Варіант 66</td>
            <td class="r2">&nbsp;</td>
        </tr>
        <tr>
            <td>&nbsp;</td>
            <td rowspan="2">&nbsp;</td>
        </tr>
        <tr>
            <td colspan="3">&nbsp;</td>
        </tr>
    </table>

    <h2>Завдання 2. Зображення (варіант 6 — телефон)</h2>
    <div class="images">
        <figure>
            <div class="phone pos">
                <div class="screen">12:00</div>
                <div class="btn"></div><div class="btn"></div><div class="btn"></div>
                <div class="btn"></div><div class="btn"></div><div class="btn"></div>
                <div class="btn"></div><div class="btn"></div><div class="btn"></div>
            </div>
            <figcaption>1. За допомогою position</figcaption>
        </figure>

        <figure>
            <div class="phone tr">
                <div class="screen">12:00</div>
                <div class="btn"></div><div class="btn"></div><div class="btn"></div>
                <div class="btn"></div><div class="btn"></div><div class="btn"></div>
                <div class="btn"></div><div class="btn"></div><div class="btn"></div>
            </div>
            <figcaption>2. За допомогою transform</figcaption>
        </figure>
    </div>
</body>
</html>
